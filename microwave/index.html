<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5f0" />
  <meta name="description" content="500Wの電子レンジ加熱時間を600W・700W・1000Wなどへ簡単換算するWebアプリ" />
  <title>レンジ時間換算</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="eyebrow">MICROWAVE CONVERTER</div>
      <h1>レンジ時間換算</h1>
      <p>500Wの加熱時間から、使いたいワット数の時間をすぐ計算。</p>
    </header>

    <section class="card source-card" aria-labelledby="source-heading">
      <div class="section-head">
        <div>
          <p class="kicker">基準</p>
          <h2 id="source-heading">500W の表示時間</h2>
        </div>
        <span class="watt-badge">500W</span>
      </div>

      <div class="time-inputs">
        <label class="number-field">
          <span>分</span>
          <input id="minutes" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" value="3" aria-label="基準の分" />
        </label>
        <div class="time-separator">:</div>
        <label class="number-field">
          <span>秒</span>
          <input id="seconds" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" value="0" aria-label="基準の秒" />
        </label>
      </div>

      <div class="quick-times" aria-label="時間のクイック入力">
        <button type="button" data-time="60">1分</button>
        <button type="button" data-time="120">2分</button>
        <button type="button" data-time="180">3分</button>
        <button type="button" data-time="300">5分</button>
      </div>
    </section>

    <section class="card target-card" aria-labelledby="target-heading">
      <div class="section-head">
        <div>
          <p class="kicker">換算先</p>
          <h2 id="target-heading">使うワット数</h2>
        </div>
      </div>

      <div class="watt-buttons" id="wattButtons" aria-label="ワット数のクイック選択">
        <button type="button" data-watt="600" class="active">600W</button>
        <button type="button" data-watt="700">700W</button>
        <button type="button" data-watt="800">800W</button>
        <button type="button" data-watt="1000">1000W</button>
      </div>

      <label class="custom-watt">
        <span>その他</span>
        <div class="custom-watt-input">
          <input id="targetWatt" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" value="600" aria-label="換算先ワット数" />
          <strong>W</strong>
        </div>
      </label>
    </section>

    <section class="result-card" aria-live="polite" aria-atomic="true">
      <p class="result-label"><span id="resultWatt">600W</span> なら</p>
      <div class="result-time" id="resultTime">2分30秒</div>
      <p class="result-sub" id="resultSub">500W・3分00秒 と同じ加熱量の目安</p>
    </section>

    <section class="card compare-card" aria-labelledby="compare-heading">
      <div class="section-head compact">
        <div>
          <p class="kicker">一覧</p>
          <h2 id="compare-heading">よく使うワット数</h2>
        </div>
      </div>
      <div class="comparison-list" id="comparisonList"></div>
    </section>

    <p class="notice">※ 換算は「ワット数 × 時間」を一定にした目安です。食品の量・形・容器や機種によって仕上がりは変わるため、様子を見ながら調整してください。</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
